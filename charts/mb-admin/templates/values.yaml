frontend:
  replicaCount: 1
  image:
    repository: 821589437001.dkr.ecr.ap-south-1.amazonaws.com/midnight-bites-admin-frontend
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

backend:
  replicaCount: 1
  image:
    repository: 821589437001.dkr.ecr.ap-south-1.amazonaws.com/midnight-bites-admin-backend
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 4000
  env:
    PORT: "4000"
  secretName: db-secret
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  livenessProbe:
    path: /health
    port: 4000
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    path: /health
    port: 4000
    initialDelaySeconds: 10
    periodSeconds: 5