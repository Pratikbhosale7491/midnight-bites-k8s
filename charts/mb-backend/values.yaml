replicaCount: 2

image:
  repository: 821589437001.dkr.ecr.ap-south-1.amazonaws.com/midnight-bites-backend
  tag: "latest"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

env:
  PORT: "3000"

secretName: db-secret

livenessProbe:
  path: /health
  port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  path: /health
  port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5