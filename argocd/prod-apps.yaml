apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-mb-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pratikbhosale7491/midnight-bites-k8s
    targetRevision: main
    path: charts/mb-frontend
    helm:
      valueFiles:
        - ../../environments/production/values-frontend.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
